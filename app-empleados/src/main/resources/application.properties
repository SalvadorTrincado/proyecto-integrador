spring.application.name=app-empleados
server.port=8081
spring.messages.basename=messages

# MySQL DataSource
spring.datasource.url=jdbc:mysql://db:3306/proyecto_integrador_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=admin_user
spring.datasource.password=admin_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

