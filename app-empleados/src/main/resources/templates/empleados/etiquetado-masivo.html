<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: layout(contenido = ~{::main})}">
<th:block th:fragment="main">
    <main>
        <h2>Etiquetado masivo de empleados</h2>

        <div class="botones-estilo">
            <button onclick="activarEstiloDecorado(true)">Decorado</button>
            <button onclick="activarEstiloDecorado(false)">Sobrio</button>
        </div>

        <form th:action="@{/empleados/etiquetado-masivo}" th:object="${etiquetadoMasivoDTO}" method="post">

            <label for="empleados">Empleados seleccionados:</label>
            <select id="empleados" th:field="*{empleadosSeleccionados}" multiple size="5">
                <option th:each="emp : ${empleados}" th:value="${emp.id}" th:text="${emp.nombre}"></option>
            </select>

            <label for="etiquetas">Etiquetas a aplicar:</label>
            <select id="etiquetas" th:field="*{etiquetasSeleccionadas}" multiple size="5">
                <option th:each="etiqueta : ${etiquetas}" th:value="${etiqueta}" th:text="${etiqueta}"></option>
            </select>

            <div class="form-buttons">
                <input type="reset" value="Vaciar selección">
                <button type="submit" onclick="return confirm('¿Aplicar etiquetas a los empleados seleccionados?')">Aplicar etiquetas</button>
            </div>

        </form>
    </main>
</th:block>
</html>
