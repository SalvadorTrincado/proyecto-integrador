<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: layout(contenido = ~{::main})}">
<th:block th:fragment="main">
  <main>
    <h2>Etiquetado de empleados subordinados</h2>

    <div class="botones-estilo">
      <button onclick="activarEstiloDecorado(true)">Decorado</button>
      <button onclick="activarEstiloDecorado(false)">Sobrio</button>
    </div>

    <form th:action="@{/empleados/etiquetado}" th:object="${etiquetadoDTO}" method="post">

      <label for="empleadoId">Empleado:</label>
      <select id="empleadoId" name="empleadoId" th:field="*{empleadoId}">
        <option th:each="emp : ${empleados}" th:value="${emp.id}" th:text="${emp.nombre}"></option>
      </select>

      <label>Etiquetas:</label>
      <div th:each="etiqueta : ${etiquetas}">
        <input type="checkbox" th:value="${etiqueta}" th:field="*{etiquetasSeleccionadas}"/>
        <span th:text="${etiqueta}"></span>
      </div>

      <div class="form-buttons">
        <input type="reset" value="Resetear formulario">
        <button type="submit" onclick="return confirm('¿Aplicar etiquetas al empleado seleccionado?')">Aplicar etiquetas</button>
      </div>
    </form>

  </main>
</th:block>
</html>
