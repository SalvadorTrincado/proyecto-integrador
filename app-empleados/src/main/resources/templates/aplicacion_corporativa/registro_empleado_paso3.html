<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: layout(contenido = ~{::main})}">
<head>
    <link rel="stylesheet" th:href="@{/css/registro_empleado_paso3.css}">
</head>
<th:block th:fragment="main">
    <main>
        <nav class="barra-pasos">
            <a th:href="@{/registro_empleado_paso1}" class="paso">Paso 1</a>
            <a th:href="@{/registro_empleado_paso2}" class="paso">Paso 2</a>
            <a th:href="@{/registro_empleado_paso3}" class="paso paso-activo">Paso 3</a>
            <a th:href="@{/registro_empleado_paso4}" class="paso">Paso 4</a>
            <a class="paso">Paso 5</a>
        </nav>

        <h2>Registro de Empleado – Paso 3: Datos profesionales</h2>

        <form th:action="@{/registro_empleado_paso3-post}" th:object="${registroEmpleadoPaso3DTO}" method="post">

            <div>
                <label for="departamento">Departamento</label>
                <select id="departamento" th:field="*{departamento}">
                    <option value="">-- Selecciona departamento --</option>
                    <option value="IT">IT</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Ventas">Ventas</option>
                    <option value="RRHH">Recursos Humanos</option>
                </select>
                <p th:if="${#fields.hasErrors('departamento')}" th:errors="*{departamento}" class="error"></p>
            </div>

            <div>
                <label>Especialidades</label>
                <th:block th:each="especialidad : ${especialidadesPosibles}">
                    <input type="checkbox" th:field="*{especialidadesSeleccionadas}" th:value="${especialidad}"
                           th:id="${'especialidad_' + especialidad}">
                    <label th:for="${'especialidad_' + especialidad}" th:text="${especialidad}"></label><br>
                </th:block>
                <p th:if="${#fields.hasErrors('especialidadesSeleccionadas')}" th:errors="*{especialidadesSeleccionadas}" class="error"></p>
            </div>

            <div style="margin-top: 1rem;">
                <button type="button" onclick="window.location.href='/registro_empleado_paso2'">Anterior</button>
                <input type="reset" value="Resetear">
                <button type="submit">Siguiente</button>
            </div>
        </form>
    </main>
</th:block>

</html>
