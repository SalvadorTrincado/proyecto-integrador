<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: layout(contenido = ~{::main})}">
<th:block th:fragment="main">
  <main>
    <nav class="barra-pasos">
      <a th:href="@{/aplicacion_corporativa/registro/paso1}" class="paso">Paso 1</a>
      <a th:href="@{/aplicacion_corporativa/registro/paso2}" class="paso">Paso 2</a>
      <a th:href="@{/aplicacion_corporativa/registro/paso3}" class="paso">Paso 3</a>
      <a th:href="@{/aplicacion_corporativa/registro/paso4}" class="paso">Paso 4</a>
      <a th:href="@{/aplicacion_corporativa/registro/resumen}" class="paso">Paso 5</a>
    </nav>


    <h2>Registro de Empleado – Paso 2: Datos de contacto</h2>


    <form th:action="@{/aplicacion_corporativa/registro/paso2}" th:object="${datosContacto}" method="post">

      <!-- Tipo de documento -->
      <label>Tipo de documento</label>
      <input type="radio" th:field="*{tipoDocumento}" value="DNI"> DNI
      <input type="radio" th:field="*{tipoDocumento}" value="NIE"> NIE
      <input type="radio" th:field="*{tipoDocumento}" value="Pasaporte"> Pasaporte
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('tipoDocumento')}" th:errors="*{tipoDocumento}" class="error"></p>

      <!-- Número de documento -->
      <label for="documento">Número de documento</label>
      <input type="text" id="documento" th:field="*{documento}">
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('documento')}" th:errors="*{documento}" class="error"></p>

      <!-- Prefijo telefónico -->
      <label for="prefijoTelefono">Prefijo telefónico</label>
      <select id="prefijoTelefono" th:field="*{prefijoTelefono}">
        <option value="">-- Selecciona prefijo --</option>
        <option value="+34">+34</option>
        <option value="+33">+33</option>
        <option value="+52">+52</option>
        <option value="+54">+54</option>
      </select>
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('prefijoTelefono')}" th:errors="*{prefijoTelefono}" class="error"></p>

      <!-- Teléfono móvil -->
      <label for="telefonoMovil">Teléfono móvil</label>
      <input type="text" id="telefonoMovil" th:field="*{telefonoMovil}">
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('telefonoMovil')}" th:errors="*{telefonoMovil}" class="error"></p>

      <!-- Dirección -->
      <label for="tipoVia">Tipo de vía</label>
      <select id="tipoVia" th:field="*{tipoVia}">
        <option value="">-- Selecciona tipo --</option>
        <option value="Calle">Calle</option>
        <option value="Avenida">Avenida</option>
        <option value="Paseo">Paseo</option>
      </select>
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('tipoVia')}" th:errors="*{tipoVia}" class="error"></p>

      <label for="nombreVia">Nombre de la vía</label>
      <input type="text" id="nombreVia" th:field="*{nombreVia}">
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('nombreVia')}" th:errors="*{nombreVia}" class="error"></p>

      <label for="numeroVia">Número</label>
      <input type="text" id="numeroVia" th:field="*{numeroVia}">
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('numeroVia')}" th:errors="*{numeroVia}" class="error"></p>

      <label for="localidad">Localidad</label>
      <input type="text" id="localidad" th:field="*{localidad}">
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('localidad')}" th:errors="*{localidad}" class="error"></p>

      <label for="codigoPostal">Código Postal</label>
      <input type="text" id="codigoPostal" th:field="*{codigoPostal}">
      <p th:if="${mostrarErrores} and ${#fields.hasErrors('codigoPostal')}" th:errors="*{codigoPostal}" class="error"></p>

      <div class="form-buttons">
        <input type="reset" value="Resetear formulario">
        <button type="submit">Siguiente</button>
      </div>
    </form>
  </main>
</th:block>
</html>
