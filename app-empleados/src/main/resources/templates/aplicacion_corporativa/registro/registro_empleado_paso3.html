<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: layout(contenido = ~{::main})}">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/registro_pasos.css}" id="estiloPasosRegistro">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<th:block th:fragment="main">
    <div class="botones-estilo-pasos">
        <button onclick="toggleEstiloPasos(true)">Activar Estilo</button>
        <button onclick="toggleEstiloPasos(false)">Desactivar Estilo</button>
    </div>
    <main class="container-registro">
        <nav class="barra-pasos">
            <a th:href="@{/registro_empleado_paso1}" class="paso">Paso 1</a>
            <a th:href="@{/registro_empleado_paso2}" class="paso">Paso 2</a>
            <a th:href="@{/registro_empleado_paso3}" class="paso paso-activo">Paso 3</a>
            <a th:href="@{/registro_empleado_paso4}" class="paso">Paso 4</a>
            <a th:href="@{/resumen/exito}" class="paso">Paso 5</a>
        </nav>

        <h2>Registro de Empleado – Paso 3: Datos profesionales</h2>

        <form th:action="@{/registro_empleado_paso3-post}" th:object="${registroEmpleadoPaso3DTO}" method="post">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" th:if="${_csrf}" />

            <div class="form-group">
                <label for="departamento">Departamento</label>
                <select id="departamento" th:field="*{departamento}">
                    <option value="">-- Selecciona departamento --</option>
                    <option value="IT">IT</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Ventas">Ventas</option>
                    <option value="RRHH">Recursos Humanos</option>
                </select>
                <p th:if="${#fields.hasErrors('departamento')}" th:errors="*{departamento}" class="error"></p>
            </div>

            <div class="form-group">
                <label>Especialidades</label>
                <div class="choices-group">
                    <th:block th:each="especialidad : ${especialidadesPosibles}">
                        <div> <input type="checkbox" th:field="*{especialidadesSeleccionadas}" th:value="${especialidad}"
                                     th:id="${'especialidad_' + especialidad.replaceAll('\\s+', '')}"> <label th:for="${'especialidad_' + especialidad.replaceAll('\\s+', '')}" class="checkbox-label" th:text="${especialidad}"></label>
                        </div>
                    </th:block>
                </div>
                <p th:if="${#fields.hasErrors('especialidadesSeleccionadas')}" th:errors="*{especialidadesSeleccionadas}" class="error"></p>
            </div>

            <div class="button-group">
                <input type="button" value="Anterior" class="anterior" onclick="window.location.href='/registro_empleado_paso2'">
                <input type="reset" value="Resetear">
                <button type="submit">Siguiente</button>
            </div>
        </form>
    </main>
    <script>
        function toggleEstiloPasos(enable) {
            var linkElement = document.getElementById('estiloPasosRegistro');
            if (linkElement) {
                linkElement.disabled = !enable;
            }
        }
    </script>
</th:block>
</html>
