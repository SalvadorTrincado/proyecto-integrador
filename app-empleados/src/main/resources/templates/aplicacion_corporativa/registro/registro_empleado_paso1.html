<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: layout(contenido = ~{::main})}">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/registro_pasos.css}" id="estiloPasosRegistro">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<th:block th:fragment="main">
    <div class="botones-estilo-pasos">
        <button onclick="toggleEstiloPasos(true)">Activar Estilo</button>
        <button onclick="toggleEstiloPasos(false)">Desactivar Estilo</button>
    </div>
    <main class="container-registro">
        <nav class="barra-pasos">
            <a th:href="@{/registro_empleado_paso1}" class="paso paso-activo">Paso 1</a>
            <a th:href="@{/registro_empleado_paso2}" class="paso">Paso 2</a>
            <a th:href="@{/registro_empleado_paso3}" class="paso">Paso 3</a>
            <a th:href="@{/registro_empleado_paso4}" class="paso">Paso 4</a>
            <a th:href="@{/resumen/exito}" class="paso">Paso 5</a>
        </nav>

        <h2>Registro de Empleado – Paso 1: Datos personales</h2>

        <form th:action="@{/registro_empleado_paso1-post}" th:object="${registroEmpleadoPaso1DTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" th:if="${_csrf}" />

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}">
                <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></p>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" th:field="*{apellidos}">
                <p th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error"></p>
            </div>

            <div class="form-group">
                <label for="fotografia">Fotografía</label>
                <input type="file" id="fotografia" name="fotografia" th:field="*{fotografia}" accept=".jpg,.jpeg,.png,.gif">
                <p th:if="${#fields.hasErrors('fotografia')}" th:errors="*{fotografia}" class="error"></p>
            </div>

            <div class="form-group">
                <label>Género</label>
                <div class="choices-group"> <input type="radio" th:field="*{generoSeleccionado}" value="Femenino" id="generoFemenino">
                    <label for="generoFemenino" class="radio-label">Femenino</label>
                    <input type="radio" th:field="*{generoSeleccionado}" value="Masculino" id="generoMasculino">
                    <label for="generoMasculino" class="radio-label">Masculino</label>
                    <input type="radio" th:field="*{generoSeleccionado}" value="Otro" id="generoOtro">
                    <label for="generoOtro" class="radio-label">Otro</label>
                </div>
                <p th:if="${#fields.hasErrors('generoSeleccionado')}" th:errors="*{generoSeleccionado}" class="error"></p>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="text" id="fechaNacimiento" th:field="*{fechaNacimiento}" placeholder="yyyy-mm-dd">
                <p th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="error"></p>
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="text" id="edad" th:field="*{edad}">
                <p th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}" class="error"></p>
            </div>

            <div class="form-group">
                <label for="paisNacimiento">País de nacimiento</label>
                <input type="text" id="paisNacimiento" th:field="*{paisNacimiento}">
                <p th:if="${#fields.hasErrors('paisNacimiento')}" th:errors="*{paisNacimiento}" class="error"></p>
            </div>

            <div class="form-group">
                <label for="comentarios">Comentarios</label>
                <textarea id="comentarios" th:field="*{comentarios}" rows="3"></textarea>
                <p th:if="${#fields.hasErrors('comentarios')}" th:errors="*{comentarios}" class="error"></p>
            </div>

            <div class="button-group">
                <input type="reset" value="Resetear">
                <button type="submit">Siguiente</button>
            </div>
        </form>
    </main>
    <script>
        function toggleEstiloPasos(enable) {
            var linkElement = document.getElementById('estiloPasosRegistro');
            if (linkElement) {
                linkElement.disabled = !enable;
            }
        }
    </script>
</th:block>
</html>
