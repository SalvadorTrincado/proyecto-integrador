<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación - Paso 2</title>
    <link rel="stylesheet" th:href="@{/css/login_paso2.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input[type="password"],
        .password-container input[type="text"] { /* Aplicar a ambos tipos */
            flex-grow: 1;
            padding-right: 35px; /* Espacio para el icono del ojo */
            /* Hereda otros estilos de input[type="password"] de login_paso2.css */
            width: calc(100% - 12px); /* Asegurar consistencia con otros inputs si es necesario */
            padding: 10px;
            border: 1px solid #a3b18a;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border 0.3s ease;
        }
        .password-container input[type="password"]:focus,
        .password-container input[type="text"]:focus { /* Estilos de focus para ambos */
            border-color: #588157;
            outline: none;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            z-index: 2; /* Para asegurar que esté sobre el borde del input si hay superposición */
        }
        .login-container {
            background-color: #dad7cd;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
            width: 380px;
            max-width: 90%;
            text-align: center;
            margin-top: 20px;
        }
        .login-container h2 {
            color: #588157;
            margin-bottom: 15px;
            font-weight: normal;
            font-size: 1.3em;
        }
        .login-container p strong {
            color: #3a5a40;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-actions {
            margin-top: 20px;
        }
        .alternative-options {
            margin-top: 15px;
            font-size: 0.9em;
        }
        .alternative-options a {
            margin: 0 5px;
        }
        .error-message {
            color: #d9534f;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Ingresa tu contraseña para: <strong th:text="${emailPaso1}"></strong></h2>

    <form th:action="@{/autenticacion/paso2-post}" method="post">
        <input type="hidden" name="email" th:value="${emailPaso1}" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <div class="password-container">
                <input type="password" id="password" name="password" required class="form-control" /> <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            </div>
        </div>

        <div th:if="${error}" class="error-message">
            <p th:text="${error}"></p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            <a th:href="@{/autenticacion/paso1}" class="btn btn-secondary" style="text-decoration: none; display: inline-block; margin-top: 10px;">Volver</a>
        </div>
    </form>
    <p class="alternative-options">
        <a th:href="@{/recuperar_password}">¿Olvidaste tu contraseña?</a>
    </p>
    <p class="alternative-options" style="margin-top: 5px;">
        ¿No tienes una cuenta? <a th:href="@{/registrar_usuario}">Regístrate aquí</a>
    </p>
</div>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');

    if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', function (e) {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Cambia el icono del ojo
            if (type === 'password') {
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            } else {
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            }
        });
        // Inicializar el icono correctamente
        if (passwordInput.getAttribute('type') === 'password') {
            togglePassword.classList.remove('fa-eye-slash');
            togglePassword.classList.add('fa-eye');
        } else {
            togglePassword.classList.remove('fa-eye');
            togglePassword.classList.add('fa-eye-slash');
        }
    }
</script>

</body>
</html>
