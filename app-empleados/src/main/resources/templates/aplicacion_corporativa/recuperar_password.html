<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
</head>
<body>
<main>
    <h2>¿Olvidaste tu contraseña?</h2>
    <p>Ingresa tu dirección de correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

    <div id="message" style="display:none; margin-top: 1rem; padding: 0.8rem; border-radius: 5px;"></div>

    <form id="forgotPasswordForm">
        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="button" onclick="sendForgotPasswordRequest()">Enviar enlace de restablecimiento</button>
    </form>

    <script>
        function sendForgotPasswordRequest() {
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');

            fetch('/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'email=' + encodeURIComponent(email)
            })
                .then(response => response.text())
                .then(data => {
                    messageDiv.textContent = data;
                    messageDiv.style.display = 'block';
                    document.getElementById('forgotPasswordForm').style.display = 'none';
                })
                .catch(error => {
                    console.error('Error:', error);
                    messageDiv.textContent = 'Ocurrió un error al enviar la solicitud.';
                    messageDiv.style.display = 'block';
                });
        }
    </script>
</main>
</body>
</html>
