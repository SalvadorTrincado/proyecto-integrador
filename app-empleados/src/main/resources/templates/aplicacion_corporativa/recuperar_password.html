<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/recuperar_password.css}"> <style>
    .password-step { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9;}
    .hidden { display: none; }
    .error-message { color: #721c24; background-color: #f8d7da; border:1px solid #f5c6cb; padding: 10px; margin-top:10px; border-radius:4px;}
    .success-message { color: #155724; background-color: #d4edda; border:1px solid #c3e6cb; padding: 10px; margin-top:10px; border-radius:4px;}
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: calc(100% - 22px); padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border:none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3;}
    .password-container { position: relative; display: flex; align-items: center; }
    .password-container input[type="password"], .password-container input[type="text"] { flex-grow: 1; padding-right: 35px; }
    .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #777; }
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<main>
    <h2>Recuperar Contraseña</h2>

    <div id="message-container">
    </div>

    <div id="step1" class="password-step">
        <h3>Paso 1: Verifica tu Email</h3>
        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="button" onclick="verificarEmail()">Verificar Email</button>
        <div id="step1-error" class="error-message hidden"></div>
    </div>

    <div id="step2" class="password-step hidden">
        <h3>Paso 2: Establece tu Nueva Contraseña</h3>
        <input type="hidden" id="verifiedEmail">
        <div class="form-group">
            <label for="nuevaPassword">Nueva Contraseña:</label>
            <div class="password-container">
                <input type="password" id="nuevaPassword" name="nuevaPassword" required>
                <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('nuevaPassword', this)"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="confirmarNuevaPassword">Confirmar Nueva Contraseña:</label>
            <div class="password-container">
                <input type="password" id="confirmarNuevaPassword" name="confirmarNuevaPassword" required>
                <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('confirmarNuevaPassword', this)"></i>
            </div>
        </div>
        <button type="button" onclick="resetearPassword()">Restablecer Contraseña</button>
        <div id="step2-error" class="error-message hidden"></div>
    </div>

    <div style="margin-top: 20px;">
        <a th:href="@{/autenticacion/paso1}">Volver al Login</a>
    </div>

</main>

<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeaderName = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    let currentEmail = '';

    function togglePasswordVisibility(inputId, iconElement) {
        const passwordInput = document.getElementById(inputId);
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        iconElement.classList.toggle('fa-eye');
        iconElement.classList.toggle('fa-eye-slash');
    }

    function mostrarMensaje(containerId, mensaje, tipo) {
        const container = document.getElementById(containerId);
        container.textContent = mensaje;
        container.className = tipo === 'error' ? 'error-message' : 'success-message';
        container.classList.remove('hidden');
        setTimeout(() => { container.classList.add('hidden'); container.textContent = '';}, 5000);
    }

    async function verificarEmail() {
        const email = document.getElementById('email').value;
        if (!email) {
            mostrarMensaje('step1-error', 'Por favor, introduce tu email.', 'error');
            return;
        }
        currentEmail = email; // Guardar email para el paso 2

        try {
            const response = await fetch('/api/password-recovery/check-email', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeaderName]: csrfToken
                },
                body: JSON.stringify({ email: email })
            });

            if (response.ok) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('verifiedEmail').value = email; // Aunque ya está en currentEmail
                document.getElementById('step2').classList.remove('hidden');
                mostrarMensaje('message-container', 'Email verificado. Por favor, establece tu nueva contraseña.', 'success');
            } else {
                const errorData = await response.json();
                mostrarMensaje('step1-error', errorData.error || 'Error al verificar el email.', 'error');
            }
        } catch (error) {
            console.error('Error en verificarEmail:', error);
            mostrarMensaje('step1-error', 'Ocurrió un error de red. Inténtalo de nuevo.', 'error');
        }
    }

    async function resetearPassword() {
        const nuevaPassword = document.getElementById('nuevaPassword').value;
        const confirmarNuevaPassword = document.getElementById('confirmarNuevaPassword').value;

        if (!nuevaPassword || !confirmarNuevaPassword) {
            mostrarMensaje('step2-error', 'Todos los campos de contraseña son obligatorios.', 'error');
            return;
        }

        const payload = {
            email: currentEmail,
            nuevaPassword: nuevaPassword,
            confirmarNuevaPassword: confirmarNuevaPassword
        };

        try {
            const response = await fetch('/api/password-recovery/reset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeaderName]: csrfToken
                },
                body: JSON.stringify(payload)
            });

            const responseData = await response.json();
            if (response.ok) {
                mostrarMensaje('message-container', responseData.mensaje || 'Contraseña restablecida con éxito. Ahora puedes iniciar sesión.', 'success');
                document.getElementById('step2').classList.add('hidden');
                // Opcional: redirigir al login después de un tiempo
                // setTimeout(() => { window.location.href = '/autenticacion/paso1'; }, 3000);
            } else {
                let errorMessage = "Error al restablecer la contraseña.";
                if (responseData.error) {
                    errorMessage = responseData.error;
                } else if (typeof responseData === 'object') {
                    // Construir mensaje de error a partir del objeto de errores
                    errorMessage = Object.entries(responseData)
                        .map(([field, msg]) => `${msg}`) // Solo mostrar el mensaje
                        .join('; ');
                }
                mostrarMensaje('step2-error', errorMessage, 'error');
            }
        } catch (error) {
            console.error('Error en resetearPassword:', error);
            mostrarMensaje('step2-error', 'Ocurrió un error de red. Inténtalo de nuevo.', 'error');
        }
    }
</script>

</body>
</html>
