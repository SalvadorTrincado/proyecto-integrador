<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro y Creación de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/crear_usuario.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        /* Aplicar a ambos tipos para mantener consistencia cuando cambia */
        .password-container input[type="password"],
        .password-container input[type="text"] {
            flex-grow: 1;
            padding-right: 35px; /* Espacio para el icono */
            /* Heredar estilos base del CSS principal */
            width: 100%;
            padding: 10px;
            border: 1px solid #a3b18a;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            margin-top: 5px; /* Si crear_usuario.css lo requiere */
            transition: border 0.3s ease;
        }
        .password-container input[type="password"]:focus,
        .password-container input[type="text"]:focus {
            outline: none;
            border-color: #588157;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%); /* Centra verticalmente si el input tiene padding */
            cursor: pointer;
            color: #777;
            z-index: 2;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Registro y Creación de Usuario</h1>

    <div th:if="${param.exito}" class="success-message">
        <p th:text="${param.exito[0]}"></p>
    </div>
    <div th:if="${error}" class="error-message general-error">
        <p th:text="${error}"></p>
    </div>
    <div th:if="${mensaje}" class="success-message">
        <p th:text="${mensaje}"></p>
    </div>

    <form th:action="@{/registrar_usuario_post}" method="post" th:object="${usuarioRegistroDTO}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" th:field="*{email}">
            <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <div class="password-container">
                <input type="password" id="password" th:field="*{password}">
                <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            </div>
            <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña:</label>
            <div class="password-container">
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
                <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
            </div>
            <div class="error-message" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <div class="error-message general-error" th:if="${#fields.hasGlobalErrors()}">
            <ul>
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="button-group">
            <button type="submit">Registrar Usuario</button>
            <button type="reset">Limpiar Formulario</button>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            ¿Ya tienes una cuenta? <a th:href="@{/autenticacion/paso1}">Iniciar Sesión</a>
        </p>
    </form>
</div>

<script>
    function setupToggle(toggleId, passwordId) {
        const toggleElement = document.getElementById(toggleId);
        const passwordElement = document.getElementById(passwordId);

        if (toggleElement && passwordElement) {
            toggleElement.addEventListener('click', function () {
                const type = passwordElement.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordElement.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
            // Initialize icon
            if (passwordElement.getAttribute('type') === 'password') {
                toggleElement.classList.remove('fa-eye-slash');
                toggleElement.classList.add('fa-eye');
            } else {
                toggleElement.classList.remove('fa-eye');
                toggleElement.classList.add('fa-eye-slash');
            }
        }
    }

    setupToggle('togglePassword', 'password');
    setupToggle('toggleConfirmPassword', 'confirmPassword');
</script>

</body>
</html>
