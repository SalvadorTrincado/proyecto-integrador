<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Personal</title>
    <link rel="stylesheet" href="/css/area_personal.css"> </head>
<body>
    <h1>Bienvenido a tu Área Personal</h1>

    <p th:if="${usuarioId != null}">Tu ID de usuario es: <span th:text="${usuarioId}"></span></p>
    <p th:unless="${usuarioId != null}">Usuario no identificado.</p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Desconectar</button>
    </form>
</body>
</html>
