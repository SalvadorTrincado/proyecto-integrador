<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Personal del Administrador</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/area_personal.css}">
  <style>
    /* Estilos adicionales para los nuevos botones/secciones */
    .admin-actions {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .admin-actions h3 {
      margin-bottom: 15px;
      color: #333;
    }
    .action-button {
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }
    .action-button:hover {
      background-color: #0056b3;
      color: white;
    }
    .action-button.secondary {
      background-color: #6c757d;
    }
    .action-button.secondary:hover {
      background-color: #545b62;
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <h2>Bienvenido, Administrador</h2>
  <p>Esta es tu área personal. Aquí podrás acceder a las diferentes funcionalidades de administración.</p>

  <div class="admin-actions">
    <h3>Gestión de Empleados</h3>
    <a th:href="@{/admin/consulta-empleados}" class="action-button">Consultar Empleados</a>
  </div>

  <div class="admin-actions">
    <h3>Gestión de Productos</h3>
    <a th:href="@{/admin/productos}" class="action-button">Carga Masiva de Productos</a>
  </div>

  <div class="admin-actions">
    <h3>Gestión de Nóminas</h3>
    <a th:href="@{/admin/nominas/crear}" class="action-button">Crear Nueva Nómina (MVC)</a>
    <a th:href="@{/admin/nominas/consultar}" class="action-button">Consultar Nóminas (MVC)</a>
  </div>

  <form th:action="@{/logout}" method="post" style="margin-top: 30px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="logout-button">Desconectar</button>
  </form>
</div>
</body>
</html>
