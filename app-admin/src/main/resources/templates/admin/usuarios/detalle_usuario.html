<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Usuario</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/detalle_nomina.css}"> <style>
    .action-buttons form {
        display: inline-block;
        margin-right: 10px;
    }
    .info-item {
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        border: 1px solid #e9ecef;
        margin-bottom: 10px; /* Espacio entre items */
    }
    .info-item strong {
        display: block;
        color: #495057;
        margin-bottom: 5px;
        font-size: 0.9em;
        text-transform: uppercase;
    }
    .info-item span {
        font-size: 1.1em;
        color: #212529;
    }
    .btn-actions { /* Estilo para los botones de acción generales de la página */
        margin-top: 30px;
        text-align: left; /* O center si se prefiere */
    }
</style>
</head>
<body>
<div class="container">
    <h1>Detalle de Usuario</h1>

    <div th:if="${mensajeExitoGlobal}" class="alert alert-success" th:text="${mensajeExitoGlobal}"></div>
    <div th:if="${errorGlobal}" class="alert alert-danger" th:text="${errorGlobal}"></div>
    <div th:if="${mensajeInfoGlobal}" class="alert alert-info" th:text="${mensajeInfoGlobal}"></div>

    <div th:if="${usuario != null}">
        <h2>Información del Usuario</h2>
        <div class="info-grid"> <div class="info-item">
            <strong>ID Usuario:</strong>
            <span th:text="${usuario.id}"></span>
        </div>
            <div class="info-item">
                <strong>Email:</strong>
                <span th:text="${usuario.email}"></span>
            </div>
            <div class="info-item">
                <strong>Cuenta Bloqueada:</strong>
                <span th:if="${usuario.cuentaBloqueada}" style="color:red; font-weight:bold;">SÍ</span>
                <span th:unless="${usuario.cuentaBloqueada}" style="color:green;">NO</span>
            </div>
            <div class="info-item">
                <strong>Intentos Fallidos de Login:</strong>
                <span th:text="${usuario.intentosFallidos}"></span>
            </div>
            <div class="info-item">
                <strong>Fecha de Bloqueo:</strong>
                <span th:text="${usuario.fechaBloqueo != null ? #temporals.format(usuario.fechaBloqueo, 'dd/MM/yyyy HH:mm:ss') : 'N/A'}"></span>
            </div>
            <div class="info-item">
                <strong>Total Conexiones Válidas:</strong>
                <span th:text="${usuario.contadorConexionesValidas != null ? usuario.contadorConexionesValidas : 0}"></span>
            </div>
        </div>

        <div class="action-buttons" style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee;">
            <h3>Acciones de Administrador</h3>
            <form th:if="${!usuario.cuentaBloqueada}" th:action="@{/admin/usuarios/bloquear/{id}(id=${usuario.id})}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
                <button type="submit" class="btn btn-danger" onclick="return confirm('¿Está seguro de que desea BLOQUEAR a este usuario?');">Bloquear Usuario</button>
            </form>
            <form th:if="${usuario.cuentaBloqueada}" th:action="@{/admin/usuarios/desbloquear/{id}(id=${usuario.id})}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
                <button type="submit" class="btn btn-success" onclick="return confirm('¿Está seguro de que desea DESBLOQUEAR a este usuario?');">Desbloquear Usuario</button>
            </form>
        </div>

    </div>
    <div th:if="${usuario == null}" class="no-results"> <p>No se pudo cargar la información del usuario.</p>
    </div>

    <div class="btn-actions"> <a th:href="@{/admin/usuarios/gestion}" class="btn btn-secondary">Volver a Gestión de Usuarios</a>
        <a th:href="@{/admin/area_personal}" class="btn btn-secondary" style="margin-left: 10px;">Volver al Área Personal</a>
    </div>
</div>
</body>
</html>
