<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Asignar Etiquetas a Empleado</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/lista_nominas.css}"> <style>
  .container {
    max-width: 900px;
    margin: 20px auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  h1, h2 {
    color: #0056b3;
    border-bottom: 2px solid #0056b3;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .form-section {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 5px;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
  }
  .form-group select, .form-group .etiquetas-checkbox-container {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .etiquetas-checkbox-container {
    max-height: 200px;
    overflow-y: auto;
    background-color: #fff;
    padding: 10px;
  }
  .etiquetas-checkbox-container label {
    font-weight: normal;
    margin-left: 5px;
  }
  .etiquetas-checkbox-container div {
    margin-bottom: 5px;
  }
  .btn {
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    text-decoration: none;
    display: inline-block;
  }
  .btn-primary { background-color: #007bff; color: white; }
  .btn-primary:hover { background-color: #0056b3; }
  .btn-secondary { background-color: #6c757d; color: white; }
  .btn-secondary:hover { background-color: #545b62; }
  .alert {
    padding: 15px;
    margin-bottom: 20px;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  .alert-success {
    color: #155724;
    background-color: #d4edda;
    border-color: #c3e6cb;
  }
  .alert-danger {
    color: #721c24;
    background-color: #f8d7da;
    border-color: #f5c6cb;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Asignar Etiquetas a Empleado</h1>

  <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
  <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

  <form th:action="@{/admin/etiquetas/asignar}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="form-section">
      <h2>Seleccionar Empleado</h2>
      <div class="form-group">
        <label for="empleadoId">Empleado:</label>
        <select id="empleadoId" name="empleadoId" class="form-control"
                onchange="if (this.value) { window.location.href = '/admin/etiquetas/asignar/' + this.value; }">
          <option value="">-- Seleccione un Empleado --</option>
          <option th:each="emp : ${empleados}"
                  th:value="${emp.id}"
                  th:text="${emp.nombre + ' ' + emp.apellidos + ' (' + emp.documento + ')'}"
                  th:selected="${empleadoSeleccionado != null && emp.id.toString() == empleadoSeleccionado.id.toString()}"></option>
        </select>
      </div>
    </div>

    <div class="form-section" th:if="${empleadoSeleccionado != null}">
      <h2 th:text="'Etiquetas para ' + ${empleadoSeleccionado.nombre} + ' ' + ${empleadoSeleccionado.apellidos}">Etiquetas</h2>
      <div class="form-group">
        <label>Seleccionar Etiquetas:</label>
        <div class="etiquetas-checkbox-container" th:if="${!#lists.isEmpty(todasLasEtiquetas)}">
          <div th:each="etiqueta : ${todasLasEtiquetas}">
            <input type="checkbox" name="etiquetasIds"
                   th:id="'etiqueta-' + ${etiqueta.id}"
                   th:value="${etiqueta.id}"
                   th:checked="${etiquetasSeleccionadasIds != null && etiquetasSeleccionadasIds.contains(etiqueta.id)}"/>
            <label th:for="'etiqueta-' + ${etiqueta.id}" th:text="${etiqueta.nombre}"></label>
          </div>
        </div>
        <p th:if="${#lists.isEmpty(todasLasEtiquetas)}">No hay etiquetas disponibles para asignar. Por favor, <a th:href="@{/admin/etiquetas}">cree alguna etiqueta</a> primero.</p>
      </div>

      <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(todasLasEtiquetas)}">Guardar Cambios en Etiquetas</button>
    </div>
    <div class="form-section" th:unless="${empleadoSeleccionado != null}">
      <p>Por favor, seleccione un empleado para ver y asignar etiquetas.</p>
    </div>
  </form>

  <div style="margin-top: 20px;">
    <a th:href="@{/admin/etiquetas}" class="btn btn-secondary">Volver a Gestión de Etiquetas</a>
    <a th:href="@{/admin/area_personal}" class="btn btn-secondary" style="margin-left: 10px;">Volver al Área Personal</a>
  </div>

</div>
</body>
</html>
