<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Etiquetas</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/lista_nominas.css}"> <style>
  .container {
    max-width: 800px;
    margin: 20px auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .form-container, .list-container {
    margin-bottom: 30px;
  }
  .form-container h2, .list-container h2 {
    color: #0056b3;
    border-bottom: 2px solid #0056b3;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
  }
  .form-group input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .btn {
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    text-decoration: none;
    display: inline-block;
    margin-right: 5px;
  }
  .btn-primary { background-color: #007bff; color: white; }
  .btn-primary:hover { background-color: #0056b3; }
  .btn-danger { background-color: #dc3545; color: white; }
  .btn-danger:hover { background-color: #c82333; }
  .btn-secondary { background-color: #6c757d; color: white; }
  .btn-secondary:hover { background-color: #545b62; }
  .btn-info { background-color: #17a2b8; color: white; }
  .btn-info:hover { background-color: #117a8b; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
  }
  th {
    background-color: #e9ecef;
    font-weight: bold;
  }
  .actions a, .actions form {
    margin-right: 5px;
    display: inline-block;
  }
  .alert {
    padding: 15px;
    margin-bottom: 20px;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  .alert-success {
    color: #155724;
    background-color: #d4edda;
    border-color: #c3e6cb;
  }
  .alert-danger {
    color: #721c24;
    background-color: #f8d7da;
    border-color: #f5c6cb;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Gestión de Etiquetas</h1>

  <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
  <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

  <div class="form-container">
    <h2 th:text="${etiqueta != null && etiqueta.id != null ? 'Editar Etiqueta' : 'Crear Nueva Etiqueta'}">Crear/Editar Etiqueta</h2>
    <form th:action="@{/admin/etiquetas/crear}" th:object="${etiqueta}" method="post">
      <input type="hidden" th:field="*{id}" />
      <div class="form-group">
        <label for="nombre">Nombre de la Etiqueta:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required maxlength="50">
        <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-message"></div>
      </div>
      <button type="submit" class="btn btn-primary" th:text="${etiqueta != null && etiqueta.id != null ? 'Guardar Cambios' : 'Crear Etiqueta'}">Crear/Guardar</button>
      <a th:href="@{/admin/etiquetas}" class="btn btn-secondary" th:if="${etiqueta != null && etiqueta.id != null}">Cancelar Edición</a>
    </form>
  </div>

  <div class="list-container">
    <h2>Etiquetas Existentes</h2>
    <div th:if="${#lists.isEmpty(etiquetas)}">
      <p>No hay etiquetas creadas.</p>
    </div>
    <table th:unless="${#lists.isEmpty(etiquetas)}">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="tag : ${etiquetas}">
        <td th:text="${tag.id}"></td>
        <td th:text="${tag.nombre}"></td>
        <td class="actions">
          <a th:href="@{/admin/etiquetas/editar/{id}(id=${tag.id})}" class="btn btn-info btn-sm">Editar</a>
          <form th:action="@{/admin/etiquetas/eliminar/{id}(id=${tag.id})}" method="post" style="display: inline;"
                onsubmit="return confirm('¿Está seguro de que desea eliminar esta etiqueta? Esta acción no se puede deshacer.');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div style="margin-top: 20px;">
    <a th:href="@{/admin/area_personal}" class="btn btn-secondary">Volver al Área Personal</a>
  </div>
</div>
</body>
</html>
