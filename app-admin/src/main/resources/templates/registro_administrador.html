<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro de Administrador</title>
</head>
<body>
<h1>Registro de Nuevo Administrador</h1>
<form th:action="@{/registro/administrador-post}" th:object="${administradorDTO}" method="post">
    <div>
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" th:field="*{email}" required="required"/>
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>
    <div>
        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" th:field="*{contraseña}" required="required"/>
        <p th:if="${#fields.hasErrors('contraseña')}" th:errors="*{contraseña}"></p>
    </div>
    <button type="submit">Registrar</button>
</form>
<p><a th:href="@{/login/administrador}">Volver al Login</a></p>
</body>
</html>
