<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carga Masiva de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .message { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        input[type="file"] { margin-bottom: 10px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        a { color: #007bff; text-decoration: none; margin-top:15px; display: inline-block;}
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>Cargar catálogo de productos desde archivo JSON</h1> <div th:if="${errorProductoCarga}" class="message error">
    <p th:text="${errorProductoCarga}"></p>
</div>
    <div th:if="${exitoProductoCarga}" class="message success">
        <p th:text="${exitoProductoCarga}"></p>
    </div>

    <form method="post"
          th:action="@{/admin/productos/carga-masiva-json}"
          enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div>
            <label for="archivoJson">Seleccionar archivo JSON:</label><br/>
            <input type="file" id="archivoJson" name="archivoJson" accept=".json,text/plain" required /> </div>
        <button type="submit">Cargar Productos</button>
    </form>
    <br/>
    <a th:href="@{/admin/area_personal}">Volver al Área Personal</a>
</div>
</body>
</html>
