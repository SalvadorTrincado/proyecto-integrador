<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión Administrador</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/login_administrador.css}">
</head>
<body>
<div class="login-container">
  <h2>Iniciar Sesión Administrador</h2>
  <form action="/login/administrador-post" method="post" th:object="${administradorDTO}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" th:field="*{email}">
    </div>
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" th:field="*{clave}">
    </div>
    <button type="submit">Iniciar Sesión</button>
    <div th:if="${error}" class="error-message" th:text="${error}"></div> </form>
</div>
</body>
</html>
