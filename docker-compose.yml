services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: proyecto_integrador_db
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: admin_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d # Asegúrate que esta ruta sea correcta y que mysql-init/init.sql exista
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "status", "-uadmin_user", "-padmin_pass"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s # Período de gracia para que MySQL inicie completamente

  app-admin:
    build:
      context: ./app-admin # Ruta al Dockerfile de app-admin
      dockerfile: Dockerfile
    container_name: admin_service
    ports:
      - "8082:8082" # Puerto para la aplicación de administración
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/proyecto_integrador_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: admin_pass
      # SERVER_SERVLET_CONTEXT_PATH: /app-admin # Descomenta si quieres que la app se sirva bajo /app-admin/
    depends_on:
      db:
        condition: service_healthy # Espera a que la base de datos esté saludable
    networks:
      - app-network

  app-empleados:
    build:
      context: ./app-empleados # Ruta al Dockerfile de app-empleados
      dockerfile: Dockerfile
    container_name: empleados_service
    ports:
      - "8081:8081" # Puerto para la aplicación de empleados
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/proyecto_integrador_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: admin_pass
      # SERVER_SERVLET_CONTEXT_PATH: /app-empleados # Descomenta si quieres que la app se sirva bajo /app-empleados/
    depends_on:
      db:
        condition: service_healthy # Espera a que la base de datos esté saludable
    networks:
      - app-network

volumes:
  mysql_data: # Define el volumen para la persistencia de datos de MySQL

networks:
  app-network: # Define una red personalizada para que los servicios se puedan comunicar
    driver: bridge